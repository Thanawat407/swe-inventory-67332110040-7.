[tool.ruff]
line-length = 100
extend-exclude = ["lab04-ai-coding-ux", "pricing_legacy.py", "inverntory.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "inverntory.py",
    "pricing_legacy.py",
    "tests/*",
    "lab04-ai-coding-ux/*",
]
